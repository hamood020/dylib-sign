name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch zsign
        run: bash scripts/fetch-zsign.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DylibSign.xcodeproj \
            -scheme DylibSign \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E 'error:|warning: .*Swift|BUILD' || true
          test -d build/Build/Products/Release-iphoneos/DylibSign.app

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/DylibSign.app out/Payload/
          cd out && zip -qry DylibSign-unsigned.ipa Payload

      - name: Inspect app bundle
        if: always()
        run: |
          APP=build/Build/Products/Release-iphoneos/DylibSign.app
          {
            echo '## App bundle'
            echo '```'
            find "$APP" -maxdepth 3 | sed "s#^$APP#.#" | sort
            echo
            echo '--- lipo'
            lipo -info "$APP/DylibSign" || true
            echo '--- otool -L'
            otool -L "$APP/DylibSign" || true
            echo '--- LC_RPATH / min OS'
            otool -l "$APP/DylibSign" | grep -A3 -E 'LC_RPATH|LC_BUILD_VERSION' || true
            for f in "$APP"/Frameworks/*.framework; do
              [ -d "$f" ] || continue
              b="$f/$(basename "$f" .framework)"
              echo "--- $(basename "$f")"
              lipo -info "$b" || true
              otool -l "$b" | grep -A4 LC_BUILD_VERSION | head -5 || true
              plutil -p "$f/Info.plist" | grep -E 'CFBundleExecutable|MinimumOSVersion|CFBundleIdentifier' || true
            done
            echo '--- Info.plist'
            plutil -p "$APP/Info.plist"
            echo '```'
            echo '## Build errors/warnings'
            echo '```'
            grep -E 'error:|warning:' xcodebuild.log | grep -v '/Vendor/zsign/' | sort -u | head -60 || true
            echo '```'
          } > out/report.md
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/DylibSign-unsigned.ipa out/report.md \
            --target "$GITHUB_SHA" \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Unsigned build of $GITHUB_SHA. Sign it before installing." \
            --prerelease

      - uses: actions/upload-artifact@v4
        with:
          name: DylibSign-unsigned
          path: out/DylibSign-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
