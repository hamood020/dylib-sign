name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch zsign
        run: bash scripts/fetch-zsign.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project DylibSign.xcodeproj \
            -scheme DylibSign \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E 'error:|warning: .*Swift|BUILD' || true
          test -d build/Build/Products/Release-iphoneos/DylibSign.app

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R build/Build/Products/Release-iphoneos/DylibSign.app out/Payload/
          cd out && zip -qry DylibSign-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: DylibSign-unsigned
          path: out/DylibSign-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
